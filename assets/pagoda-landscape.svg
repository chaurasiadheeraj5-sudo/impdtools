<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 500" width="450" height="500" preserveAspectRatio="xMinYMid meet">
  <defs>
    <linearGradient id="pagodaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3B45" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#4B5A65" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7B8B96" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="pagodaMntGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#556570" stop-opacity="0.5"/>
      <stop offset="65%" stop-color="#758590" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#A5B3BD" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rolling Mountain Peak on Left -->
  <path d="M0 260 C60 210 120 190 180 230 C230 260 270 240 330 280 C390 320 420 380 450 420 L450 500 L0 500 Z" fill="url(#pagodaMntGrad)"/>

  <!-- Multi-tiered East Asian Pagoda (Nestled around x=110, y=140) -->
  <g fill="url(#pagodaGrad)">
    <!-- Spire (Finial / Tenzu) -->
    <path d="M109 110 L111 110 L111 135 L109 135 Z"/>
    <circle cx="110" cy="115" r="2.5"/>
    <circle cx="110" cy="123" r="2.8"/>

    <!-- Tier 5 (Top Roof with Curved Eaves) -->
    <path d="M96 142 C103 140 117 140 124 142 L120 136 C115 135 105 135 100 136 Z"/>
    <rect x="104" y="142" width="12" height="7"/>

    <!-- Tier 4 Roof -->
    <path d="M92 153 C101 150 119 150 128 153 L123 147 C116 146 104 146 97 147 Z"/>
    <rect x="102" y="153" width="16" height="8"/>

    <!-- Tier 3 Roof -->
    <path d="M87 166 C98 162 122 162 133 166 L127 159 C118 158 102 158 93 159 Z"/>
    <rect x="100" y="166" width="20" height="9"/>

    <!-- Tier 2 Roof -->
    <path d="M81 180 C95 175 125 175 139 180 L132 172 C121 171 99 171 88 172 Z"/>
    <rect x="97" y="180" width="26" height="11"/>

    <!-- Tier 1 Base Roof -->
    <path d="M74 197 C91 191 129 191 146 197 L138 188 C124 186 96 186 82 188 Z"/>
    <rect x="94" y="197" width="32" height="15"/>
    <!-- Base Platform -->
    <path d="M86 212 H134 V224 H86 Z"/>
  </g>

  <!-- Sumi-e Pine Trees Surrounding Pagoda -->
  <g fill="#25323C" opacity="0.65">
    <!-- Left Pine 1 -->
    <path d="M50 215 C55 208 65 206 72 210 C70 213 60 215 50 215 Z"/>
    <path d="M42 225 C50 218 64 218 75 222 C68 226 55 227 42 225 Z"/>
    <path d="M35 238 C48 230 68 230 80 236 C70 241 50 242 35 238 Z"/>
    <!-- Trunk -->
    <path d="M58 222 Q60 250 63 270 L60 270 Q56 250 54 222 Z"/>

    <!-- Right Pine 2 -->
    <path d="M142 215 C150 207 165 208 174 214 C166 217 152 217 142 215 Z"/>
    <path d="M140 228 C152 220 172 222 185 229 C172 233 155 232 140 228 Z"/>
    <path d="M138 244 C155 235 180 237 195 245 C180 250 156 248 138 244 Z"/>
    <!-- Trunk -->
    <path d="M158 225 Q160 255 162 280 L159 280 Q157 255 155 225 Z"/>
  </g>
</svg>